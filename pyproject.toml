[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",  # la longitud la controla el formateador, no el linter
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# app.py llama a verificar_e_instalar_dependencias() antes de sus imports.
# La Fase 3 lo saca del ámbito de módulo y esta excepción desaparece.
"app.py" = ["E402"]
